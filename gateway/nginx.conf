user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No revelar la version de Nginx
    server_tokens off;

    # Log estructurado JSON: fecha, metodo, ruta (sin query string), estado, duracion,
    # estado/tiempo del upstream e identificador de peticion. Nunca se registran cuerpos ni cabeceras sensibles.
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"duration_ms":"$request_time",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    include /etc/nginx/conf.d/*.conf;
}
