# Cabeceras y comportamiento comun del proxy inverso hacia el backend NestJS.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# Trazabilidad: se SOBRESCRIBE cualquier X-Request-ID enviado por el cliente con el generado por Nginx.
proxy_set_header X-Request-ID $request_id;
# El backend devuelve el mismo id; se oculta para que el cliente reciba una sola cabecera (la del Gateway).
proxy_hide_header X-Request-ID;
proxy_hide_header X-Powered-By;

# Los errores JSON del backend (4xx/5xx) se entregan tal cual; error_page solo aplica a errores propios de Nginx.
proxy_intercept_errors off;
proxy_buffering on;
