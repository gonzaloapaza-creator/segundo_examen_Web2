# CORS gestionado EXCLUSIVAMENTE por el Gateway (el backend no emite cabeceras CORS -> sin duplicados).
# $cors_origin solo contiene el Origin de la peticion si esta en la lista blanca CORS_ALLOWED_ORIGINS;
# si esta vacio, Nginx omite las cabeceras (no se refleja ningun origen arbitrario).
# Nota: add_header dentro de un location anula los del nivel server, por eso se repite X-Request-ID.

if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Accept, Idempotency-Key, X-Requested-With" always;
    add_header Access-Control-Expose-Headers "X-Request-ID, Idempotent-Replayed" always;
    add_header Access-Control-Max-Age 600 always;
    add_header Vary Origin always;
    add_header X-Request-ID $request_id always;
    add_header Content-Length 0 always;
    return 204;
}

add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Expose-Headers "X-Request-ID, Idempotent-Replayed" always;
add_header Vary Origin always;
add_header X-Request-ID $request_id always;
add_header X-Content-Type-Options nosniff always;
